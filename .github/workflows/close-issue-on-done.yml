name: Close issue when status set to "Done"

on:
  projects_v2_item:
    types: [edited]

jobs:
  close-issue:
    runs-on: ubuntu-latest
    if: |
      github.event.changes.field_value.field_name == 'Status' &&
      github.event.projects_v2_item.content_type == 'Issue'
    steps:
      - name: Close issue if status is "Done"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const itemId = context.payload.projects_v2_item.node_id;
            const contentNodeId = context.payload.projects_v2_item.content_node_id;

            // Confirm current status is "Done" (guards against race conditions)
            const itemData = await github.graphql(`
              query($itemId: ID!) {
                node(id: $itemId) {
                  ... on ProjectV2Item {
                    fieldValueByName(name: "Status") {
                      ... on ProjectV2ItemFieldSingleSelectValue {
                        name
                      }
                    }
                  }
                }
              }
            `, { itemId });

            const status = itemData.node?.fieldValueByName?.name;
            if (status !== 'Done') return;

            // Resolve issue number and repo from node ID
            const issueData = await github.graphql(`
              query($nodeId: ID!) {
                node(id: $nodeId) {
                  ... on Issue {
                    number
                    repository {
                      name
                      owner { login }
                    }
                  }
                }
              }
            `, { nodeId: contentNodeId });

            const { number, repository } = issueData.node;

            await github.rest.issues.update({
              owner: repository.owner.login,
              repo: repository.name,
              issue_number: number,
              state: 'closed',
              state_reason: 'completed'
            });