[workspace]
name = "artis-model"
description = "Aquatic Resource Trade in Species (ARTIS) Model"
authors = ["Seafood Globalization Lab"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]
requires-pixi = ">=0.83"

[environments]
default = { features = ["dev"] }

[activation.env]
RETICULATE_PYTHON = "$CONDA_PREFIX/bin/python"
R_LIBS_USER = "$CONDA_PREFIX/lib/R/library"
PYTHONNOUSERSITE = "1"
ARTIS_CRAN_SNAPSHOT = "https://packagemanager.posit.co/cran/2026-06-21"

[dependencies]
"r-aws.s3" = "*"
"r-data.table" = "*"
"r-future.apply" = "*"
r-arrow = "*"
r-base = "4.5.*"
r-cli = "*"
r-countrycode = "*"
r-dbi = "*"
r-doparallel = "*"
r-dplyr = "*"
r-duckdb = "*"
r-duckdbfs = "*"
r-foreach = "*"
r-future = "*"
r-glue = "*"
r-lifecycle = "*"
r-magrittr = "*"
r-memoise = "*"
r-qs2 = "*"
r-readxl = "*"
r-remotes = "*"
r-reticulate = "*"
r-stringr = "==1.5.2"
r-tibble = "*"
r-tidyr = "*"

python = "3.12.*"
numpy = "==1.26.4"
scipy = "==1.13.0"
qpsolvers = "==4.3.2"
quadprog = "==0.1.12"
cvxopt = "==1.3.2"

[feature.dev.dependencies]
r-devtools = "*"
r-roxygen2 = "==7.3.3"
r-testthat = ">=3.0"
r-rcmdcheck = "*"
r-pkgbuild = ">=1.4"
r-languageserver = "*"

[tasks.install-extras]
description = "Install rfishbase 5.0.3 (not on conda-forge)"
cmd = '''
Rscript -e 'remotes::install_version("rfishbase", version = "5.0.3",
  repos = Sys.getenv("ARTIS_CRAN_SNAPSHOT"), dependencies = FALSE, upgrade = "never")'
'''

[tasks.install]
description = "Install the local artis package"
cmd = "R CMD INSTALL --no-multiarch --with-keep.source ."

[tasks.py-check]
description = "Check that Python and the QP solvers load"
cmd = '''
Rscript -e 'qp <- reticulate::import("qpsolvers"); print(reticulate::py_config());
  stopifnot(all(c("quadprog", "cvxopt") %in% qp$available_solvers))'
'''

[tasks.setup]
description = "Install rfishbase and artis, then check Python"
depends-on = ["install-extras", "install", "py-check"]

[tasks.clean-inputs]
description = "Run inst/01-clean-input-data.R"
cmd = "Rscript inst/01-clean-input-data.R"
depends-on = ["install"]

[feature.dev.tasks.document]
description = "Regenerate man/ and NAMESPACE"
cmd = "Rscript -e 'roxygen2::roxygenise()'"

[feature.dev.tasks.test]
description = "Run tests"
cmd = "Rscript -e 'devtools::test(stop_on_failure = TRUE)'"

[feature.dev.tasks.check]
description = "Run R CMD check"
cmd = '''Rscript -e 'rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error", check_dir = "check")' '''

[feature.dev.target.osx-arm64.tasks.rstudio]
description = "Open RStudio with this environment"
cmd = "/Applications/RStudio.app/Contents/MacOS/RStudio artis-model.Rproj"
env = { RSTUDIO_WHICH_R = "$CONDA_PREFIX/bin/R" }
